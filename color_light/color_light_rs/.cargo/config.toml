[target.xtensa-esp32-none-elf]
# runner = "espflash flash --monitor --no-skip"
runner = "espflash flash --monitor"


[env]
# ESP_LOGLEVEL="INFO"
ESP_LOGLEVEL="TRACE"

[build]
rustflags = [
  # "-C", "link-arg=-nostartfiles",
  # ble example
  # "-C", "link-arg=-Tlinkall.x", # fails
  "-C", "link-arg=-Trom_functions.x",
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["core"]
